
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Sara | Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-sara">
    <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="index.html">SARA.</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
                <li class="nav-item"><a class="nav-link" href="carrito.html">Mi carrito</a></li>
            </ul>
        </div>
    </div>
</nav>

<header class="container py-5">
    <p class="text-secondary mb-1">NUESTRA COLECCIÓN</p>
    <h1 class="display-5 fw-bold">Galería de productos</h1>
    <p>Encuentra tus favoritos y descubre algo nuevo.</p>
</header>

<main class="container pb-5">
    <div class="row g-4">
        <aside class="col-lg-3">
            <div class="bg-white rounded-4 p-4">
                <h4 class="fw-bold mb-3">Filtrar productos</h4>

                <label for="categoria" class="form-label">Categoría</label>
                <select id="categoria" class="form-select mb-3">
                    <option value="todos">Todas las categorías</option>
                </select>

                <label for="buscar" class="form-label">Buscar</label>
                <input id="buscar" class="form-control mb-3" placeholder="Nombre del producto">

                <label for="orden" class="form-label">Ordenar por</label>
                <select id="orden" class="form-select">
                    <option value="relevancia">Relevancia</option>
                    <option value="menor">Menor precio</option>
                    <option value="mayor">Mayor precio</option>
                </select>

                <a href="carrito.html" class="btn btn-outline-dark w-100 mt-4">Ir al carrito</a>
            </div>
        </aside>

        <section class="col-lg-9">
            <div class="d-flex justify-content-between mb-3">
                <h2 class="h4 fw-bold">Todos los productos</h2>
                <span id="contador" class="text-secondary"></span>
            </div>

            <div id="catalogo" class="row g-4">
                <p>Cargando productos...</p>
            </div>
        </section>
    </div>
</main>

<footer class="bg-sara text-white text-center py-4">
    <h4>SARA.</h4>
    <p class="mb-0">© 2026 Tienda Sara | Proyecto académico</p>
</footer>

<script>
const API_URL = "http://localhost:5000/api/productos";

let productos = [];

const catalogo = document.getElementById("catalogo");
const selectorCategoria = document.getElementById("categoria");
const buscador = document.getElementById("buscar");
const selectorOrden = document.getElementById("orden");
const contador = document.getElementById("contador");

function obtenerImagen(nombre) {
    const texto = nombre.toLowerCase();

    if (texto.includes("playera") || texto.includes("camiseta")) {
        return "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&auto=format&fit=crop";
    }
    if (texto.includes("tenis") || texto.includes("calzado")) {
        return "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop";
    }
    if (texto.includes("mochila")) {
        return "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop";
    }
    if (texto.includes("audífono") || texto.includes("audifono")) {
        return "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop";
    }
    if (texto.includes("smartphone") || texto.includes("teléfono") || texto.includes("telefono")) {
        return "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600&auto=format&fit=crop";
    }

    return "https://placehold.co/600x400?text=Producto";
}

async function cargarProductos() {
    try {
        const respuesta = await fetch(API_URL);

        if (!respuesta.ok) {
            throw new Error("La API respondió con el estado " + respuesta.status);
        }

        const datos = await respuesta.json();

        productos = datos.map(p => ({
            id: Number(p.id),
            nombre: p.descripcion,
            precio: Number(p.precio),
            idCategoria: Number(p.idCategoria),
            idMarca: Number(p.idMarca),
            cantidadDisponible: Number(p.cantidad),
            imagen: obtenerImagen(p.descripcion)
        }));

        const categorias = [...new Set(productos.map(p => p.idCategoria))];

        selectorCategoria.innerHTML =
            '<option value="todos">Todas las categorías</option>';

        categorias.forEach(id => {
            selectorCategoria.add(new Option("Categoría " + id, String(id)));
        });

        mostrarProductos();

    } catch (error) {
        console.error(error);
        catalogo.innerHTML = `
            <div class="col-12">
                <div class="alert alert-danger">
                    No se pudieron cargar los productos.
                    Verifica que la API esté ejecutándose en localhost:5000.
                </div>
            </div>`;
        contador.textContent = "Error de conexión";
    }
}

function mostrarProductos() {
    const categoria = selectorCategoria.value;
    const busqueda = buscador.value.toLowerCase().trim();
    const orden = selectorOrden.value;

    let lista = productos.filter(p =>
        (categoria === "todos" || p.idCategoria === Number(categoria)) &&
        p.nombre.toLowerCase().includes(busqueda)
    );

    if (orden === "menor") lista.sort((a, b) => a.precio - b.precio);
    if (orden === "mayor") lista.sort((a, b) => b.precio - a.precio);

    contador.textContent = lista.length + " productos";

    if (lista.length === 0) {
        catalogo.innerHTML = '<p class="col-12">No se encontraron productos.</p>';
        return;
    }

    catalogo.innerHTML = lista.map(p => `
        <div class="col-6 col-md-6 col-xl-4">
            <div class="card product-card h-100">
                <img src="${p.imagen}"
                     class="card-img-top"
                     alt="${p.nombre}"
                     loading="lazy"
                     onerror="this.onerror=null;this.src='https://placehold.co/600x400?text=Producto';">

                <div class="card-body d-flex flex-column">
                    <span class="badge text-bg-warning align-self-start mb-2">
                        ${p.cantidadDisponible > 0 ? "Disponible" : "Agotado"}
                    </span>

                    <h5>${p.nombre}</h5>
                    <p class="text-secondary small">Categoría ${p.idCategoria}</p>
                    <p class="text-secondary small">Existencias: ${p.cantidadDisponible}</p>
                    <p class="price">$${p.precio.toFixed(2)} MXN</p>

                    <button class="btn btn-sara mt-auto"
                            onclick="agregar(${p.id})"
                            ${p.cantidadDisponible <= 0 ? "disabled" : ""}>
                        Agregar al carrito
                    </button>
                </div>
            </div>
        </div>
    `).join("");
}

function agregar(id) {
    const producto = productos.find(p => p.id === id);
    if (!producto) return;

    let carrito = JSON.parse(localStorage.getItem("carritoSara") || "[]");
    const existente = carrito.find(p => Number(p.id) === id);
    const cantidadActual = existente ? Number(existente.cantidad) : 0;

    if (cantidadActual >= producto.cantidadDisponible) {
        alert("No hay más existencias disponibles.");
        return;
    }

    if (existente) {
        existente.cantidad++;
    } else {
        carrito.push({ ...producto, cantidad: 1 });
    }

    localStorage.setItem("carritoSara", JSON.stringify(carrito));
    alert("Producto agregado al carrito.");
}

selectorCategoria.addEventListener("change", mostrarProductos);
buscador.addEventListener("input", mostrarProductos);
selectorOrden.addEventListener("change", mostrarProductos);

cargarProductos();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
